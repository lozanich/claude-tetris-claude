<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">MODO CLARO</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="pause-menu" class="pause-menu hidden">
          <button id="resume-btn" type="button">Reanudar</button>
          <button id="restart-btn" type="button">Reiniciar</button>
          <button id="controls-btn" type="button" aria-expanded="false">Ver controles</button>
          <ul id="controls-list" class="controls-list hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
          <label class="level-select" for="start-level">
            Nivel inicial
            <select id="start-level"></select>
          </label>
        </div>

        <form id="name-form" class="hidden" autocomplete="off">
          <label id="name-label" for="name-input"></label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="10" placeholder="Tu nombre" />
            <button id="save-btn" type="submit">Guardar</button>
          </div>
        </form>

        <section id="records" class="hidden">
          <span class="label">TOP 5</span>
          <ol id="records-list"></ol>
          <p id="records-extra"></p>
          <button id="reset-records" type="button">Borrar records</button>
        </section>

        <button id="gameover-restart-btn" class="menu-btn hidden" type="button">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro">MODO CLARO</button>
      <select id="skin-select" aria-label="Cambiar skin visual">
        <option value="retro">RETRO</option>
        <option value="neon">NEON</option>
        <option value="pastel">PASTEL</option>
        <option value="pixel">PIXEL ART</option>
      </select>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section hidden" id="combo-section">
          <span class="label">COMBO</span>
          <span class="value combo-value" id="combo">x1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section" id="highscores-section">
          <span class="label">RECORDS</span>
          <ol class="highscore-list" id="highscore-list"></ol>
          <div class="highscore-stats">
            <span>Mejor combo: <strong id="best-combo-stat">-</strong></span>
            <span>Líneas máx: <strong id="max-lines-stat">-</strong></span>
          </div>
          <button id="reset-highscores-btn" type="button">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div id="overlay-box" class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="highscore-entry" class="highscore-entry hidden">
          <label for="player-name-input">¡Nuevo récord! Ingresa tu nombre:</label>
          <input type="text" id="player-name-input" maxlength="12" placeholder="AAA" autocomplete="off" />
          <button id="save-highscore-btn" type="button">Guardar</button>
        </div>

        <div class="overlay-highscores">
          <span class="label">TOP 5</span>
          <ol class="highscore-list" id="overlay-highscore-list"></ol>
        </div>

        <button id="restart-btn">Reiniciar</button>

        <div id="pause-menu" class="hidden">
          <p class="pause-title">PAUSA</p>
          <button id="resume-btn" type="button">Reanudar</button>
          <button id="pause-restart-btn" type="button">Reiniciar</button>
          <button id="toggle-controls-btn" type="button">Ver controles</button>

          <ul id="pause-controls-list" class="hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>

          <label class="start-level-label" for="start-level">Nivel inicial</label>
          <select id="start-level">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
